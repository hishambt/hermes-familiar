name: familiar-platform
label: Familiar
kind: platform
version: 2.11.2
description: >
  The channel a Familiar client reaches a Hermes machine through: the machine dials out and holds one
  connection, and messages, asks and reads all travel over it.

  A cron job's output is pushed, never read: the instance's Jobs API carries status alone, so a job that
  ran looks identical to one whose words nobody can reach. Registering a platform with a cron delivery
  env var is what makes `deliver: familiar` a valid job target, and this plugin's send() is where the
  output goes. The same path carries Hermes' own send_message, so any event can notify a client, not only
  scheduled work.

  Inbound: a person's message arrives at the machine's own loopback ingress and becomes a turn, and a tool
  that needs permission, a clarify question and a slash confirmation are raised as asks carrying the id
  their answer comes back with.

  Reach: a machine behind NAT has no address and no key on it, so it pairs by code and is asked down the
  connection it holds. Its conversations, the model picker's inventory and its whole cron schedule are
  answered from Hermes' own state, in the API's own shape, and a path it cannot serve is refused by name.

  Standard library only. Settings live in config.yaml (platforms.familiar.extra) with FAMILIAR_* env vars
  as the fallback.
author: Hisham Buteen
# No manifest_version, so this is a v1 manifest: the format every Hermes reads. v2 is documented in the
# install's own docs, and this build's `hermes plugins install` refuses a plugin that declares it ("requires
# manifest_version 2, but this installer only supports up to 1") - so a v2 declaration makes the plugin
# impossible to install for the very person it is for. `license`/`homepage`/`tags` are v2 fields too, and a
# field the loader does not know is ignored at best; they live in the README instead.
# Declared as optional, never required: `requires_env` makes `hermes plugins install` prompt, and the
# install this plugin is designed for runs from a console whose commands cannot answer a prompt. The token
# is set afterwards with `config set FAMILIAR_TOKEN=...` (the _TOKEN suffix is what routes it to .env).
optional_env:
  - name: FAMILIAR_TOKEN
    description: "Bearer token Familiar issued for this instance (required before it will deliver)"
    prompt: "Familiar instance token"
    password: true
  - name: FAMILIAR_URL
    description: "Where Familiar's API is (default: http://127.0.0.1:3100)"
    prompt: "Familiar URL"
    password: false
  - name: FAMILIAR_HOME_CHANNEL
    description: "Default delivery target for cron jobs that name no chat (default: default)"
    prompt: "Familiar home channel"
    password: false
  - name: FAMILIAR_INSTANCE
    description: "Label for this instance in Familiar's notifications (default: the profile name)"
    prompt: "Instance label"
    password: false
