name: familiar-notify-platform
label: Familiar
kind: platform
version: 1.0.0
description: >
  Delivery-only gateway platform that pushes Hermes output to a Familiar client's notifications, over HTTP.

  A cron job's output is pushed, never read: the instance's Jobs API carries status alone, so a job that
  ran looks identical to one whose words nobody can reach. Registering a platform with a cron delivery
  env var is what makes `deliver: familiar` a valid job target, and this plugin's send() is where the
  output goes. The same path carries Hermes' own send_message, so any event can notify a client, not only
  scheduled work.

  Nothing arrives over it: Familiar reads an instance through the instance's own API, so this platform has
  no inbound path, never carries a turn, and grants no way in.

  Standard library only. Settings live in config.yaml (platforms.familiar.extra) with FAMILIAR_* env vars
  as the fallback.
author: Hisham Buteen
license: MIT
homepage: https://github.com/hishambt/hermes-familiar-notify
tags: [gateway, platform, notifications, cron]
manifest_version: 2
# Declared as optional, never required: `requires_env` makes `hermes plugins install` prompt, and the
# install this plugin is designed for runs from a console whose commands cannot answer a prompt. The token
# is set afterwards with `config set FAMILIAR_TOKEN=...` (the _TOKEN suffix is what routes it to .env).
optional_env:
  - name: FAMILIAR_TOKEN
    description: "Bearer token Familiar issued for this instance (required before it will deliver)"
    prompt: "Familiar instance token"
    password: true
  - name: FAMILIAR_URL
    description: "Where Familiar's API is (default: http://127.0.0.1:3100)"
    prompt: "Familiar URL"
    password: false
  - name: FAMILIAR_HOME_CHANNEL
    description: "Default delivery target for cron jobs that name no chat (default: default)"
    prompt: "Familiar home channel"
    password: false
  - name: FAMILIAR_INSTANCE
    description: "Label for this instance in Familiar's notifications (default: the profile name)"
    prompt: "Instance label"
    password: false
